# Example only. Copy to k8s/secret.yaml (git-ignored), fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
# Never commit a populated file: this repository is public. The values that used to be committed here
# (JWT key, Gmail app password, SA password) are compromised and must not be reused.
apiVersion: v1
kind: Secret
metadata:
  name: ebay-secrets
  namespace: ebay-clone
type: Opaque
stringData:
  # Bootstrap SA password for the SQL Server container (policy: >= 8 chars, upper, lower, digit, symbol)
  SA_PASSWORD_INITIAL: ""
  # Password the API uses (same policy; not a short/guessable value)
  SA_PASSWORD_ACTUAL: ""
  # >= 32 bytes, random: openssl rand -base64 64. The app refuses to start with a short or published key.
  JWT_KEY: ""
  # Gmail app password of EmailSettings__SenderEmail
  EMAIL_PASSWORD: ""

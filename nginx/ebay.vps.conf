# ==============================================================================
# Nginx Virtual Host Configuration - Triển khai trên VPS (Cùng với Petlify)
# Vị trí file trên VPS: /etc/nginx/conf.d/ebay.conf (hoặc trong thư mục conf.d của Nginx host)
# ==============================================================================

upstream ebay_admin_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. Redirect HTTP sang HTTPS (Nếu có Domain + SSL)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name ebay.yourdomain.com; # Thay bằng domain hoặc subdomain của bạn
# 
#     location ^~ /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#         allow all;
#     }
# 
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

# 2. Reverse Proxy cấu hình chính
server {
    listen 80; # Hoặc: listen 443 ssl http2;
    listen [::]:80;
    server_name ebay.yourdomain.com; # Thay bằng domain của bạn (hoặc xóa server_name nếu dùng trực tiếp IP)

    # Nếu cấu hình SSL qua Certbot / Cloudflare Origin CA:
    # ssl_certificate /etc/letsencrypt/live/ebay.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ebay.yourdomain.com/privkey.pem;

    client_max_body_size 50M;

    # Hỗ trợ SignalR WebSocket Hubs
    location /hubs/ {
        proxy_pass http://ebay_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API & Static SPA Web Routing
    location / {
        proxy_pass http://ebay_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

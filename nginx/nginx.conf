user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'Backend: $upstream_addr Status: $upstream_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # ============================================================
    # RATE LIMITING LỚP 1 (NGINX GATEWAY - BẢO VỆ VÒNG NGOÀI)
    # ============================================================
    # Trả về mã lỗi 429 chuẩn HTTP Too Many Requests khi bị giới hạn (mặc định Nginx là 503)
    limit_req_status 429;

    # 1. Zone bảo vệ toàn bộ API chung: Tối đa 25 requests/giây theo IP (burst 20)
    limit_req_zone $binary_remote_addr zone=api_gateway_zone:10m rate=25r/s;

    # 2. Zone bảo vệ riêng cho Login/Auth: 12 requests/phút theo IP (burst 6)
    limit_req_zone $binary_remote_addr zone=login_gateway_zone:10m rate=12r/m;

    # Tự động chọn Connection header cho HTTP hoặc WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    # Upstream: Cân bằng tải giữa 2 instance API (Round-Robin)
    upstream backend_api {
        server api1:8080 max_fails=3 fail_timeout=10s;
        server api2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen       80;
        server_name  localhost;

        # Custom JSON Response cho lỗi 429 tại Nginx Layer
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            add_header X-RateLimit-Source "Nginx-Gateway" always;
            return 429 '{"error": "Too Many Requests", "source": "Nginx Load Balancer", "message": "Gateway rate limit exceeded. Please slow down."}\n';
        }

        # Health check riêng cho Nginx (không áp dụng rate limit)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # SignalR WebSocket Hubs (Real-time)
        location /hubs/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── LỚP 1: Bảo vệ Login Endpoint (Chống Brute-force tầng mạng) ──
        location /api/Auth/login {
            limit_req zone=login_gateway_zone burst=6 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Backend-Server $upstream_addr always;
        }

        # ── LỚP 1: Bảo vệ toàn bộ API endpoints (Chống DDoS/Flood) ──
        location /api/ {
            limit_req zone=api_gateway_zone burst=20 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Backend-Server $upstream_addr always;
        }

        # Định tuyến tài nguyên tĩnh & React SPA
        location / {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            add_header X-Backend-Server $upstream_addr always;
        }
    }
}

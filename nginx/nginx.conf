user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'Backend: $upstream_addr Status: $upstream_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Tự động chọn Connection header cho HTTP hoặc WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    # Upstream: Load Balancing cân bằng tải giữa 2 instance API (Round-Robin)
    upstream backend_api {
        server api1:8080 max_fails=3 fail_timeout=10s;
        server api2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen       80;
        server_name  localhost;

        # Health check riêng cho Nginx
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # SignalR WebSocket Hubs (Real-time qua Redis Backplane)
        location /hubs/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Định tuyến toàn bộ request HTTP (API endpoints & React Frontend)
        location / {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Header để kiểm tra request được phục vụ bởi instance nào
            add_header X-Backend-Server $upstream_addr always;
        }
    }
}

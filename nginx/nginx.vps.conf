user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'Backend: $upstream_addr Status: $upstream_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Rate limiting
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_gateway_zone:10m rate=25r/s;
    limit_req_zone $binary_remote_addr zone=login_gateway_zone:10m rate=12r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    # Upstream trỏ vào api1 (.NET 10 Kestrel)
    upstream backend_api {
        server api1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            add_header X-RateLimit-Source "Nginx-Gateway" always;
            return 429 '{"error": "Too Many Requests", "source": "Nginx Load Balancer", "message": "Gateway rate limit exceeded. Please slow down."}\n';
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # SignalR WebSocket Hubs (Real-time)
        location /hubs/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Bảo vệ Login & 2FA
        location ~ ^/api/Auth/(login|verify-2fa)$ {
            limit_req zone=login_gateway_zone burst=6 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Backend-Server $upstream_addr always;
        }

        # Toàn bộ API
        location /api/ {
            limit_req zone=api_gateway_zone burst=20 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Backend-Server $upstream_addr always;
        }

        # Static Web & React SPA
        location / {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            add_header X-Backend-Server $upstream_addr always;
        }
    }
}

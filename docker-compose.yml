services:
  # ============================================================
  # SQL Server 2022
  # ============================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ebay_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Đây là mật khẩu "mồi" để qua mặt Docker lúc khởi tạo
      MSSQL_SA_PASSWORD: "InternalStrongPassword123!" 
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    # Kịch bản "Vượt rào": Chạy server -> Đợi -> Đổi về mật khẩu gốc của bạn
    command: >
      bash -c "
      /opt/mssql/bin/sqlservr & 
      sleep 25; 
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'InternalStrongPassword123!' -C -Q \"ALTER LOGIN sa WITH PASSWORD = '${SA_PASSWORD}', CHECK_POLICY = OFF;\" ; 
      wait"
    healthcheck:
      # Healthcheck vẫn dùng ${SA_PASSWORD} vì sau 25s nó sẽ đổi về cái này
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================================================
  # Redis – SignalR Backplane (load balancing real-time)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ebay_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # ASP.NET Core API - Instance 1
  # ============================================================
  api1: &api-common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebay_api_1
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__MyCnn: "Server=db,1433;Database=CloneEbayDB;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "EbayClone"
      Jwt__Audience: "EbayCloneUsers"
      EmailSettings__SenderEmail: "${EMAIL_SENDER}"
      EmailSettings__SenderPassword: "${EMAIL_PASSWORD}"
      EmailSettings__SmtpServer: "smtp.gmail.com"
      EmailSettings__Port: "587"
      Redis__ConnectionString: "redis:6379"
    restart: unless-stopped

  # ============================================================
  # ASP.NET Core API - Instance 2
  # ============================================================
  api2:
    <<: *api-common
    container_name: ebay_api_2

  # ============================================================
  # Nginx Load Balancer (Cân bằng tải cho 2 instances API)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: ebay_nginx_lb
    restart: unless-stopped
    ports:
      - "5000:80"   # Cổng truy cập chính (http://localhost:5000)
      - "80:80"     # Cổng HTTP tiêu chuẩn
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  sqlserver_data:
    name: ebay_sqlserver_data

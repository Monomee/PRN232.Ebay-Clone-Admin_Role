# ============================================================
# Cấu hình mặc định khi chạy với docker-compose trên máy local
# Dùng trong .jmx bằng ${__P(tên,giá_trị_mặc_định)}
#   vd: ${__P(host,localhost)}  ${__P(threads,10)}
# Ghi đè khi chạy CLI: -Jthreads=300
# ============================================================

# --- Target ---
protocol=http
host=localhost
port=5000

# --- Tài khoản dùng để lấy token (không bật 2FA) ---
# SuperAdmin: có đủ quyền cho mọi kịch bản (/api/Users cần policy ManageUsers = Support|SuperAdmin)
admin_email=superadmin@ebay.local
admin_password=Admin123!

# --- Tải mặc định (kịch bản 02/03/04) ---
threads=100
rampup=30
duration=120

# --- Brute-force (kịch bản 01) ---
# Policy "strict": 5 request / 60s -> request thứ 6 phải trả 429
bruteforce_allowed=5

# --- Đường dẫn CSV (tương đối so với thư mục plans/) ---
data_dir=../data
